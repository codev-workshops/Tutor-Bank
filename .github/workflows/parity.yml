name: Booking and TimeSlot parity

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  parity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: tutor_bank_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Start moto
        run: |
          docker run -d --name tutor-bank-moto -p 127.0.0.1:5001:5000 motoserver/moto
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5001/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/tutor_bank_test
      - run: npx prisma db push
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/tutor_bank_test
      - run: npm run test:parity
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/tutor_bank_test
          AWS_ACCESS_KEY_ID: dummy
          AWS_SECRET_ACCESS_KEY: dummy
          AWS_REGION: us-east-1
          AWS_ENDPOINT_URL: http://127.0.0.1:5001
          DYNAMODB_TABLE_PREFIX: parity_
